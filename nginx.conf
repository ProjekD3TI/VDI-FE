upstream reverb_backend {
    # Mengarah langsung ke nama kontainer reverb dan port internalnya di network docker
    server vdi-reverb:8080;
}

server {
    listen       80;
    server_name  localhost;

    # 1. Handle Aplikasi React Frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html; # Penting untuk React Router
    }

    # 2. KUNCI UTAMA: Handle WebSocket Reverb
    location /app/ {
        proxy_pass http://reverb_backend;
        
        # Amankan HTTP Header untuk Protokol Upgrade WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        # Meneruskan informasi client asli
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Menghindari timeout putus di tengah jalan
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}